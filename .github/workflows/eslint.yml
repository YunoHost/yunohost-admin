name: ESlint

on:
  push:
      branches:
          - dev
  pull_request:

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install yarn dependencies
      run: yarn install --frozen-lockfile
    - name: Run linter
      run: yarn lint
    - name: Run type checking
      run: yarn type-check
