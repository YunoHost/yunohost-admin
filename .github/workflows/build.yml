name: Build Debian package

on:
  pull_request:
  push:
    branches: [main, dev, bullseye, bookworm, trixie]
    tags:
      - 'debian/*'

env:
  DEBEMAIL: yunohost@yunohost.org
  DEBFULLNAME: YunoHost

jobs:
  build:
    name: Build debian package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: yunohost-admin

      - name: Setup corepack for Yarn
        run: |
          sudo apt install node-corepack
          # This is required because on ubuntu, node-corepack installs on /usr/local/bin
          sudo corepack enable --install-directory /usr/bin

      - name: Build YunoHost
        uses: yunohost/yunohost-ci/.github/actions/build_deb@main
        with:
          path: yunohost-admin
          outdir: packages
          unstable: ${{ ! startsWith(github.ref, 'debian/') }}

      - name: Upload built packages
        uses: actions/upload-artifact@v7
        with:
          path: packages/*
